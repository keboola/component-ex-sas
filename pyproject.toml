[project]
name = "sas"
dynamic = ["version"]
readme = "README.md"
requires-python = "~=3.13"
dependencies = [
    "keboola-component>=1.6.10",
    "mock>=5.2.0",
    # pandas is a hard runtime dep of pyreadstat: it imports pandas whenever
    # output_format is unset (the default for metadata-only reads, including
    # the one done internally inside pyreadstat.read_file_in_chunks).
    "pandas>=2.0.0",
    "paramiko>=5.0.0",
    "polars>=1.0.0",
    "pyreadstat>=1.2.0",
    "pydantic>=2.11.3",
    "ruff>=0.11.5",
]

[tool.ruff]
line-length = 120
extend-exclude = [
    "__pycache__",
    ".venv",
    "venv",
]

